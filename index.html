<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpendWise – Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3FA;--card:#FFFFFF;--ink:#231F3B;--mute:#625E7D;--line:#DEDCEC;--accent:#5B3FD0;--accent-ink:#FFFFFF;--in:#1B7F48;--out:#C0392B;--warn:#B7791F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141225;--card:#1E1B35;--ink:#ECEAF8;--mute:#A9A5C7;--line:#34304F;--accent:#9B86F5;--accent-ink:#17102F;--in:#52C98A;--out:#F27B6D;--warn:#E8B04B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141225;--card:#1E1B35;--ink:#ECEAF8;--mute:#A9A5C7;--line:#34304F;--accent:#9B86F5;--accent-ink:#17102F;--in:#52C98A;--out:#F27B6D;--warn:#E8B04B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:1.1rem;margin:0 0 10px}
.mute{color:var(--mute);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sum b{display:block;font-size:1.25rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.in{color:var(--in)}.out{color:var(--out)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:600;font-size:.92rem}
input,select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;margin:0;font-size:.85rem;font-weight:600}
.err{color:var(--out);margin:8px 0 0;min-height:1.2em}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.meter span{display:block;height:100%;background:var(--in)}
.alert{margin:8px 0 0;font-weight:600}
.cat{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:8px 0}
.cat i{display:block;height:14px;border-radius:4px;background:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--mute)}
.amt{font-weight:700;white-space:nowrap}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.foot{color:var(--mute);font-size:.85rem;margin-top:20px}
@media (max-width:420px){.sum b{font-size:1.05rem}.cat{grid-template-columns:80px 1fr auto}}
</style>
</head>
<body>
<div class="wrap">
<h1>SpendWise</h1>
<p class="mute">Track income and spending, set a monthly budget, and see where your money goes.</p>

<div class="sum" id="sum"></div>

<section class="card" id="budget"></section>

<section class="card">
<h2>Add a transaction</h2>
<div class="grid">
<label>Type<select id="ty"><option value="out">Expense</option><option value="in">Income</option></select></label>
<label>Amount<input id="am" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
<label>Category<select id="ca"><option>Food</option><option>Transport</option><option>Rent</option><option>Shopping</option><option>Bills</option><option>Fun</option><option>Salary</option><option>Other</option></select></label>
<label>Date<input id="dt" type="date"></label>
</div>
<label style="margin-top:10px">Note (optional)<input id="nt" maxlength="60" placeholder="e.g. Lunch with friends"></label>
<button class="btn" data-act="add">Add transaction</button>
<p class="err" id="err"></p>
</section>

<section class="card"><h2>Spending by category this month</h2><div id="chart"></div></section>

<section class="card"><h2>Transactions</h2><div id="list"></div>
<div class="sw"><button class="btn ghost sm" data-act="sample">Load sample data</button><button class="btn ghost sm" data-act="clear">Clear all</button></div>
</section>
<p class="foot">Everything is saved in this browser only.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let T=load('sw_t',[]),S=load('sw_s',{budget:0,cur:'$'});
const today=new Date().toISOString().slice(0,10);
$('#dt').value=today;
const ym=today.slice(0,7);
const money=n=>S.cur+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function render(){
  const inc=T.filter(t=>t.ty==='in').reduce((a,t)=>a+t.am,0);
  const exp=T.filter(t=>t.ty==='out').reduce((a,t)=>a+t.am,0);
  $('#sum').innerHTML=`<div><span class="mute">Balance</span><b>${money(inc-exp)}</b></div><div><span class="mute">Income</span><b class="in">${money(inc)}</b></div><div><span class="mute">Expenses</span><b class="out">${money(exp)}</b></div>`;

  const month=T.filter(t=>t.ty==='out'&&t.dt.startsWith(ym));
  const spent=month.reduce((a,t)=>a+t.am,0);
  const pct=S.budget>0?spent/S.budget*100:0;
  let msg='',col='var(--in)';
  if(S.budget>0){
    if(pct>=100){msg=`You’ve gone over this month’s budget by ${money(spent-S.budget)}.`;col='var(--out)'}
    else if(pct>=80){msg=`Careful: you’ve used ${Math.round(pct)}% of this month’s budget.`;col='var(--warn)'}
    else msg=`You’ve used ${Math.round(pct)}% of this month’s budget. ${money(S.budget-spent)} left.`;
  }else msg='Set a monthly budget to get spending alerts.';
  $('#budget').innerHTML=`<h2>Monthly budget</h2><div class="grid">
  <label>Budget<input id="bg" type="number" min="0" step="1" inputmode="decimal" value="${S.budget||''}" placeholder="e.g. 500"></label>
  <label>Currency symbol<input id="cu" maxlength="3" value="${esc(S.cur)}"></label></div>
  <button class="btn ghost sm" style="margin-top:10px" data-act="setb">Save budget</button>
  <div class="meter"><span style="width:${Math.min(pct,100)}%;background:${col}"></span></div>
  <p class="alert" style="color:${col}">${msg}</p>`;

  const by={};month.forEach(t=>by[t.ca]=(by[t.ca]||0)+t.am);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=ent.length?ent[0][1]:1;
  $('#chart').innerHTML=ent.length?ent.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><i style="width:${Math.max(v/max*100,3)}%"></i><b>${money(v)}</b></div>`).join(''):'<p class="mute">No expenses this month yet. Add one above to see the chart.</p>';

  const sorted=T.slice().sort((a,b)=>b.dt.localeCompare(a.dt)||b.id-a.id);
  $('#list').innerHTML=sorted.length?sorted.map(t=>`<div class="row"><div><b>${esc(t.nt||t.ca)}</b><br><small>${esc(t.ca)}, ${esc(t.dt)}</small></div>
  <div style="display:flex;gap:10px;align-items:center"><span class="amt ${t.ty}">${t.ty==='in'?'+':'-'}${money(t.am)}</span><button class="btn ghost sm" data-act="del" data-id="${t.id}" aria-label="Delete transaction">Delete</button></div></div>`).join(''):'<p class="mute">No transactions yet. Add your first one above, or load sample data.</p>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='add'){
    const am=parseFloat($('#am').value),dt=$('#dt').value;
    if(!(am>0))return $('#err').textContent='Enter an amount greater than zero.';
    if(!dt)return $('#err').textContent='Choose a date.';
    T.push({id:Date.now(),ty:$('#ty').value,am,ca:$('#ca').value,dt,nt:$('#nt').value.trim()});save('sw_t',T);render();
    $('#am').value='';$('#nt').value='';
  }else if(a==='del'){T=T.filter(t=>t.id!==+b.dataset.id);save('sw_t',T);render()}
  else if(a==='setb'){S.budget=Math.max(parseFloat($('#bg').value)||0,0);S.cur=$('#cu').value||'$';save('sw_s',S);render()}
  else if(a==='sample'){
    const d=n=>{const x=new Date();x.setDate(Math.max(1,x.getDate()-n));return x.toISOString().slice(0,10)};
    const s=[['in',2000,'Salary','Monthly salary',0],['out',650,'Rent','Room rent',1],['out',120,'Food','Groceries',2],['out',45,'Transport','Bus pass',3],['out',80,'Shopping','New headphones',4],['out',60,'Fun','Movie night',5],['out',95,'Bills','Phone and internet',6]];
    s.forEach((r,i)=>T.push({id:Date.now()+i,ty:r[0],am:r[1],ca:r[2],nt:r[3],dt:d(r[4])}));
    if(!S.budget)S.budget=1000;save('sw_t',T);save('sw_s',S);render();
  }else if(a==='clear'){T=[];save('sw_t',T);render()}
});
render();
</script>
</body>
</html>
